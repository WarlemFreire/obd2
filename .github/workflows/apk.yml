# Compila o APK a cada push. O APK sai em Actions > a execução > Artifacts.
# É de debug: assinado com a chave padrão do Android, instala direto no celular
# liberando "instalar apps de fontes desconhecidas".
name: APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Simulador de adaptador ELM327 com cenário Toyota, para o teste de ponta a ponta.
      - name: Subir o ELM327-emulator
        run: |
          pip install "git+https://github.com/Ircama/ELM327-emulator@dd3b1d2b19368875830ea8c86cea070040c26caf"
          python -m elm -n 35000 -s car -d
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/35000) 2>/dev/null && exit 0; sleep 1; done
          echo "emulador não subiu" && exit 1

      - name: Testes do núcleo (incluindo descoberta contra o emulador)
        run: ./gradlew --no-daemon :core:test
        env:
          OBD_EMULADOR: 127.0.0.1:35000

      - name: Lint e APK
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Nomear com data e commit
        id: apk
        run: |
          nome="obd-etios-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          mkdir -p saida
          mv app/build/outputs/apk/debug/app-debug.apk "saida/$nome.apk"
          cp core/build/relatorio-emulador.txt saida/ 2>/dev/null || true
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: saida
          if-no-files-found: error
          retention-days: 90
